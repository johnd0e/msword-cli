[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "msword-cli"
version = "0.4.0"
description = "Command-line interface and Python API for automating Microsoft Word via COM"
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.8"
authors = [
  { name = "Andrii Synytsyn" }
]
keywords = ["microsoft", "word", "cli", "automation", "com", "win32"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: BSD License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Office Suites"
]
dependencies = [
  "click>=8.0",
  "msword-cli-compare-merge~=0.4.0",
  "msword-cli-save-as~=0.4.0",
  "tomli>=1.1; python_version < '3.11'",
  "pywin32>=306"
]

[project.urls]
Homepage = "https://github.com/johnd0e/msword-cli"
Repository = "https://github.com/johnd0e/msword-cli"
Issues = "https://github.com/johnd0e/msword-cli/issues"
"Original Project" = "https://github.com/waylan/msword-cli"

[project.scripts]
msw = "msword_cli:cli"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.16.8",
]

# Keep the required gate strict on correctness and maintainability while
# legacy style and compatibility issues are cleaned up.
[tool.ruff]
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE001", "DTZ001", "FA100", "FA102", "PERF203", "PERF401", "PLR0911", "PLR0912", "PLR0913", "PLR0917", "PLR2004", "SIM105", "S110", "S112", "S603"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E501", "S101"]
"plugins/**/tests/**/*.py" = ["E501", "S101"]

[tool.uv.sources]
msword-cli-compare-merge = { workspace = true }
msword-cli-save-as = { workspace = true }

[tool.uv.workspace]
members = ["plugins/*"]


[tool.pytest.ini_options]
markers = [
  "integration: requires a live Microsoft Word COM environment"
]
